name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      allow_older:
        description: Allow replacement of an older stable release (requires exact tag confirmation)
        required: false
        type: boolean
        default: false
      confirm_tag:
        description: Exact older tag to replace (for example v1.2.3)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Run repository checks
        run: make check
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/ai.stealthvision.Airloom.desktop
          appstreamcli validate --no-net packaging/ai.stealthvision.Airloom.metainfo.xml

  webkit-ui:
    name: Headless WebKit UI
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install headless WebKit dependencies
        run: dnf install -y python3-gobject gobject-introspection gtk4 libadwaita webkitgtk6.0 libnotify xorg-x11-server-Xvfb xorg-x11-xauth
      - name: Run isolated WebKit UI regressions
        shell: bash
        env:
          NO_AT_BRIDGE: "1"
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "${XDG_RUNTIME_DIR}"
          for script in scripts/test-heatmap scripts/test-save-refresh; do
            xvfb-run -a -s "-screen 0 1280x800x24" "${script}"
          done

  release-eligibility:
    name: Validate release eligibility
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Checkout release history
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check release ref and versions
        id: check
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          ALLOW_OLDER: ${{ inputs.allow_older }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          args=(--ref "${GITHUB_REF}" --version-root .)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ALLOW_OLDER}" == "true" ]]; then
            args+=(--allow-older --confirm-tag "${CONFIRM_TAG}")
          fi
          python3 scripts/check-release.py "${args[@]}"
          echo "eligible=true" >> "${GITHUB_OUTPUT}"

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [test, release-eligibility]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77 # gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Airloom-${{ matrix.arch }}.flatpak
          manifest-path: packaging/ai.stealthvision.Airloom.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          branch: stable
          upload-artifact: false
      - name: Import signing key
        if: needs.release-eligibility.outputs.eligible == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: scripts/import-signing-key.sh
      - name: Rebuild bundle with update-repo origin
        shell: bash
        run: |
          # Embedding --gpg-keys makes flatpak *require* a commit signature at
          # install time, so keys and signing must travel together: release
          # builds sign the repo commit (build-sign — the signature the
          # installer checks; build-bundle --gpg-sign is not enough) and embed
          # the key, while unsigned PR/main bundles get neither.
          gpg_args=()
          if [ -n "${GPG_KEY_ID:-}" ]; then
            flatpak build-sign repo ai.stealthvision.Airloom stable \
              --arch="${{ matrix.arch }}" \
              --gpg-sign="${GPG_KEY_ID}" \
              --gpg-homedir="${GNUPGHOME}"
            gpg_args=(--gpg-keys="packaging/airloom-flatpak.gpg")
          fi
          flatpak build-bundle repo "Airloom-${{ matrix.arch }}.flatpak" \
            ai.stealthvision.Airloom stable \
            --arch="${{ matrix.arch }}" \
            --repo-url="https://ijbaird.github.io/airloom/repo" \
            --runtime-repo="https://dl.flathub.org/repo/flathub.flatpakrepo" \
            "${gpg_args[@]}"
      - name: Record release provenance
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          runtime_ref="runtime/org.gnome.Platform/${arch}/50"
          sdk_ref="runtime/org.gnome.Sdk/${arch}/50"
          runtime_commit="$(flatpak info --arch="${arch}" --show-commit org.gnome.Platform//50)"
          sdk_commit="$(flatpak info --arch="${arch}" --show-commit org.gnome.Sdk//50)"
          scripts/record-provenance.sh \
            --output "Airloom-${arch}.provenance.json" \
            --source-sha "${GITHUB_SHA}" \
            --image-ref "ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77" \
            --image-digest "sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77" \
            --runtime-ref "${runtime_ref}" \
            --runtime-commit "${runtime_commit}" \
            --sdk-ref "${sdk_ref}" \
            --sdk-commit "${sdk_commit}" \
            --tool-version "flatpak=$(flatpak --version)" \
            --tool-version "flatpak-builder=$(flatpak-builder --version)" \
            --tool-ref "actions/checkout=3d3c42e5aac5ba805825da76410c181273ba90b1" \
            --tool-ref "flatpak/flatpak-github-actions/flatpak-builder=79327416609af08178ad73b352877e51450790b3" \
            --tool-ref "actions/upload-artifact=043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" \
            --bundle "Airloom-${arch}.flatpak"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airloom-${{ matrix.arch }}
          path: |
            Airloom-${{ matrix.arch }}.flatpak
            Airloom-${{ matrix.arch }}.provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive update-repo artifact
        if: needs.release-eligibility.outputs.eligible == 'true'
        run: tar -cf "airloom-repo-${{ matrix.arch }}.tar" repo
      - name: Upload update-repo artifact
        if: needs.release-eligibility.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airloom-repo-${{ matrix.arch }}
          path: airloom-repo-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: needs.release-eligibility.outputs.eligible == 'true'
    needs: [flatpak, release-eligibility]
    runs-on: ubuntu-24.04
    concurrency:
      group: stable-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Revalidate release eligibility
        shell: bash
        env:
          ALLOW_OLDER: ${{ inputs.allow_older }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          args=(--ref "${GITHUB_REF}" --version-root .)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ALLOW_OLDER}" == "true" ]]; then
            args+=(--allow-older --confirm-tag "${CONFIRM_TAG}")
          fi
          python3 scripts/check-release.py "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-@(x86_64|aarch64)
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.flatpak > SHA256SUMS
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS dist/*.provenance.json \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS dist/*.provenance.json \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Airloom ${GITHUB_REF_NAME#v}"
          fi

  publish-repo:
    name: Publish update repository
    if: needs.release-eligibility.outputs.eligible == 'true'
    needs: [flatpak, release-eligibility]
    runs-on: ubuntu-24.04
    concurrency:
      group: stable-publication
      cancel-in-progress: false
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77 # gnome-50
      options: --privileged
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Revalidate release eligibility
        shell: bash
        env:
          ALLOW_OLDER: ${{ inputs.allow_older }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          args=(--ref "${GITHUB_REF}" --version-root .)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ALLOW_OLDER}" == "true" ]]; then
            args+=(--allow-older --confirm-tag "${CONFIRM_TAG}")
          fi
          python3 scripts/check-release.py "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-repo-*
          path: repos
      - name: Extract update-repo artifacts
        shell: bash
        run: |
          set -e
          for dir in repos/airloom-repo-*/; do
            dir="${dir%/}"
            arch="${dir#repos/airloom-repo-}"
            tar -xf "${dir}/airloom-repo-${arch}.tar" -C "${dir}"
            rm -f "${dir}/airloom-repo-${arch}.tar"
            rm -rf "${dir}.extracted"
            mv "${dir}/repo" "${dir}.extracted"
            rm -rf "${dir}"
            mv "${dir}.extracted" "${dir}"
          done
      - name: Import signing key
        if: needs.release-eligibility.outputs.eligible == 'true'
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: scripts/import-signing-key.sh
      - name: Assemble site
        run: scripts/publish-flatpak-repo.sh _site repos/airloom-repo-x86_64 repos/airloom-repo-aarch64
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
