name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript
        run: node --check airloom/resources/app.js
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/ai.stealthvision.Airloom.desktop
          appstreamcli validate --no-net packaging/ai.stealthvision.Airloom.metainfo.xml

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: Airloom-${{ matrix.arch }}.flatpak
          manifest-path: packaging/ai.stealthvision.Airloom.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
          branch: stable
          upload-artifact: false
      - name: Rebuild bundle with update-repo origin
        run: |
          flatpak build-bundle repo "Airloom-${{ matrix.arch }}.flatpak" \
            ai.stealthvision.Airloom stable \
            --arch="${{ matrix.arch }}" \
            --repo-url="https://ijbaird.github.io/airloom/repo" \
            --runtime-repo="https://dl.flathub.org/repo/flathub.flatpakrepo" \
            --gpg-keys="packaging/airloom-flatpak.gpg"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airloom-${{ matrix.arch }}
          path: Airloom-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 30
      - name: Upload update-repo artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airloom-repo-${{ matrix.arch }}
          path: repo
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum *.flatpak > SHA256SUMS
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Airloom ${GITHUB_REF_NAME#v}"
          fi

  publish-repo:
    name: Publish update repository
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-repo-*
          path: repos
      - name: Import signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "${FLATPAK_GPG_PRIVATE_KEY}" || { echo "FLATPAK_GPG_PRIVATE_KEY secret is not set" >&2; exit 1; }
          keydir="$(mktemp -d)"
          chmod 700 "${keydir}"
          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | GNUPGHOME="${keydir}" gpg --batch --import
          key_id="$(GNUPGHOME="${keydir}" gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "${key_id}" || { echo "no secret key found after import" >&2; exit 1; }
          echo "GNUPGHOME=${keydir}" >> "${GITHUB_ENV}"
          echo "GPG_KEY_ID=${key_id}" >> "${GITHUB_ENV}"
      - name: Assemble site
        run: scripts/publish-flatpak-repo.sh _site repos/airloom-repo-x86_64 repos/airloom-repo-aarch64
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
