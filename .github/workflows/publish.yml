name: Publish Airloom

on:
  workflow_call:
    inputs:
      source_sha:
        description: Intended source commit captured by release eligibility
        required: true
        type: string
      allow_older:
        description: Allow replacement of an older stable release
        required: false
        type: boolean
        default: false
      confirm_tag:
        description: Exact older tag confirmation
        required: false
        type: string
        default: ''
    secrets:
      FLATPAK_GPG_PRIVATE_KEY:
        description: Production Flatpak repository signing key
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for prior stable publications
        uses: softprops/turnstyle@3805450be63b8c80577dc253e8c17e9132036df4 # v3.3.3
        with:
          same-branch-only: false
          retries: 3
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify checkout source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - name: Revalidate release eligibility
        shell: bash
        env:
          ALLOW_OLDER: ${{ inputs.allow_older }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          args=(--ref "${GITHUB_REF}" --version-root . --source-sha "${EXPECTED_SOURCE_SHA}")
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ALLOW_OLDER}" == "true" ]]; then
            args+=(--allow-older --confirm-tag "${CONFIRM_TAG}")
          fi
          python3 scripts/check-release.py "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-@(x86_64|aarch64)
          path: dist
          merge-multiple: true
      - name: Verify downloaded artifact provenance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          args=()
          for arch in x86_64 aarch64; do
            args+=(
              --provenance "dist/Airloom-${arch}.provenance.json"
              --bundle "dist/Airloom-${arch}.flatpak"
            )
          done
          python3 scripts/check-release-provenance.py \
            --source-sha "${EXPECTED_SOURCE_SHA}" "${args[@]}"
      - name: Generate checksums
        run: cd dist && sha256sum *.flatpak > SHA256SUMS
      - name: Create release and upload bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS dist/*.provenance.json \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.flatpak dist/SHA256SUMS dist/*.provenance.json \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --generate-notes \
              --title "Airloom ${GITHUB_REF_NAME#v}"
          fi

  publish-repo:
    name: Publish update repository
    needs: [release]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77 # gnome-50
      options: --privileged
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      # Steps run as root on a workspace the runner's host user owns, and
      # checkout trusts it only under its own temporary HOME. Trust exactly
      # this container path for every later git call in the job.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Verify checkout source commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - name: Revalidate release eligibility
        shell: bash
        env:
          ALLOW_OLDER: ${{ inputs.allow_older }}
          CONFIRM_TAG: ${{ inputs.confirm_tag }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          args=(--ref "${GITHUB_REF}" --version-root . --source-sha "${EXPECTED_SOURCE_SHA}")
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${ALLOW_OLDER}" == "true" ]]; then
            args+=(--allow-older --confirm-tag "${CONFIRM_TAG}")
          fi
          python3 scripts/check-release.py "${args[@]}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: airloom-repo-*
          path: repos
      - name: Verify downloaded artifact provenance
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          args=()
          for repo_arch in x86_64 aarch64; do
            args+=(
              --provenance "repos/airloom-repo-${repo_arch}/Airloom-${repo_arch}.provenance.json"
              --repository-tar "repos/airloom-repo-${repo_arch}/airloom-repo-${repo_arch}.tar"
            )
          done
          python3 scripts/check-release-provenance.py \
            --source-sha "${EXPECTED_SOURCE_SHA}" "${args[@]}"
      - name: Extract update-repo artifacts
        shell: bash
        run: |
          set -euo pipefail
          for dir in repos/airloom-repo-*/; do
            dir="${dir%/}"
            arch="${dir#repos/airloom-repo-}"
            tar -xf "${dir}/airloom-repo-${arch}.tar" -C "${dir}"
            rm -f "${dir}/airloom-repo-${arch}.tar"
            rm -rf "${dir}.extracted"
            mv "${dir}/repo" "${dir}.extracted"
            rm -rf "${dir}"
            mv "${dir}.extracted" "${dir}"
          done
      - name: Import production signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          AIRLOOM_REQUIRE_PRODUCTION_KEY: "1"
        run: scripts/import-signing-key.sh
      - name: Assemble site
        run: PUBKEY_FILE="${FLATPAK_GPG_PUBLIC_KEY}" scripts/publish-flatpak-repo.sh _site repos/airloom-repo-x86_64 repos/airloom-repo-aarch64
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
